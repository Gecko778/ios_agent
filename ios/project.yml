name: LocalAssistant
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.LocalAssistant
targets:
  LocalAssistant:
    type: application
    platform: iOS
    sources:
      - path: LocalAssistant
    info:
      path: LocalAssistant/Info.plist
    settings:
      base:
        INFOPLIST_FILE: LocalAssistant/Info.plist
        CODE_SIGN_STYLE: Automatic
