[project]
name = "local-assistant-gateway"
version = "0.1.0"
description = "Local gateway for a Siri-invoked map assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools]
packages = ["assistant"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
